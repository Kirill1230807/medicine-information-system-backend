name: ci.yml
on:
  push:
    # Налаштування запуску при push у головну гілку (або master/main) та Pull Request
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven' # Кешування залежностей Maven

      - name: Grant execute permission for Maven wrapper
        run: chmod +x mvnw

      # Крок 3: Статичний аналіз коду (Checkstyle)
      # Виклик плагіна напряму гарантує блокування, якщо є помилки
      - name: Run Static Code Analysis (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Compile project
        run: ./mvnw compile

      - name: Run Unit Tests
        run: ./mvnw test

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Вимога: лише локальна збірка в межах раннера
          tags: medicine-backend:local-test

  push-to-registry:
    needs: docker-build
    runs-on: ubuntu-latest
    # Виконувати лише для push у головну гілку (не для PR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/medicine-information-system-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=true

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}