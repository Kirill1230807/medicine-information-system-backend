apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medical-user-service.fullname" . }}-config
  labels:
    {{- include "medical-user-service.labels" . | nindent 4 }}
data:
  DB_URL: {{ .Values.config.dbUrl | quote }}
  KEYCLOAK_ISSUER_URI: {{ .Values.config.keycloakIssuerUri | quote }}
  APPOINTMENT_SERVICE_URL: {{ .Values.config.appointmentServiceUrl | quote }}