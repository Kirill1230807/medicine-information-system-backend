apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medical-user-service.fullname" . }}-secret
  labels:
    {{- include "medical-user-service.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USERNAME: {{ .Values.secrets.dbUsername | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}