replicaCount: 1

image:
  repository: medical-user-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

ingress:
  enabled: false
  host: user-service.local
  path: /
  pathType: Prefix
  annotations: { }

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

config:
  dbUrl: "jdbc:postgresql://medical-postgres:5432/users_db"
  keycloakIssuerUri: "http://keycloak:8080/realms/medical-realm"
  appointmentServiceUrl: "http://appointment-service:8083"

secrets:
  dbUsername: "postgres"
  dbPassword: "postgrespassword"

postgresql:
  enabled: false