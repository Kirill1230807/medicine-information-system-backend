server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:medical-backend}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:medical-backend-dev-secret}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/medical-realm}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/medical-realm}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**, /api/doctors/**, /api/patients/**, /api/admin/**
            - id: appointment-service
              uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/appointments/**