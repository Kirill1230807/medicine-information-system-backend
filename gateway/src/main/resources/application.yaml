server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: medical-client
            client-secret: medical-client-dev-secret
            scope:
             - openid
             - profile
             - email
            authorization-grant-type: authorization_code
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/medical-realm
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/medical-realm
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/users/**,/api/doctors/**,/api/patients/**,/api/admin/**
              filters:
                - TokenRelay=
            - id: appointment-service
              uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/appointments/**
              filters:
                - TokenRelay=