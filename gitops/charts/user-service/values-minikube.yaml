replicaCount: 5

image:
  repository: kirill1230507/medical-user-service
  tag: "1.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

existingSecret: medical-secret

rollout:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: { duration: 30s }
        - setWeight: 80
        - pause: { duration: 30s }

env:
  DB_URL: "jdbc:postgresql://host.minikube.internal:5433/users_db"
  KEYCLOAK_ISSUER_URI: "http://host.minikube.internal:8081/realms/medical-realm"
  APPOINTMENT_SERVICE_URL: "http://host.minikube.internal:8083"
  APP_VERSION: "1.1.0"