syntax = "proto3";

package com.bank.grpc.appointment;

option java_multiple_files = true;
option java_package = "com.bank.grpc.appointment";
option java_outer_classname = "AppointmentQueryProto";

service AppointmentQueryService {
  rpc CountAppointments (CountAppointmentsRequest) returns (CountAppointmentsResponse);
  rpc GetDoctorStats (DoctorIdRequest) returns (DoctorAppointmentsResponse);
  rpc GetNextPatientAppointment (PatientIdRequest) returns (NextAppointmentResponse);
}

message CountAppointmentsRequest {}

message CountAppointmentsResponse {
  int64 total_count = 1;
}

message DoctorIdRequest {
  string doctor_id = 1;
}

message DoctorAppointmentsResponse {
  string doctor_id = 1;
  int64 active_appointments_count = 2;
}

message PatientIdRequest {
  string patient_id = 1;
}

message NextAppointmentResponse {
  string appointment_id = 1;
  string doctor_id = 2;
  string appointment_time = 3;
  string status = 4;
}