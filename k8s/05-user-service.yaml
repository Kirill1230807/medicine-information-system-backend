apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: medical-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: kirill1230507/user-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: medical-config
                  key: DB_URL_USERS
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: medical-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medical-secret
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: medical-config
                  key: KEYCLOAK_ISSUER_URI
            - name: APPOINTMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: medical-config
                  key: APPOINTMENT_SERVICE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 50
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
               port: 8082
            initialDelaySeconds: 40
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: medical-system
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: user-service