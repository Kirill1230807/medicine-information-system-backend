spring.application.name=medicine-information-system-backend

spring.datasource.url=jdbc:postgresql://localhost:5433/medical_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.client.registration.keycloak.client-id=medical-client
spring.security.oauth2.client.registration.keycloak.client-secret=medical-client-dev-secret
spring.security.oauth2.client.registration.keycloak.scope[0]=openid
spring.security.oauth2.client.registration.keycloak.scope[1]=profile
spring.security.oauth2.client.registration.keycloak.scope[2]=email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/medical-realm

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/medical-realm