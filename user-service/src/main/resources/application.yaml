server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/users_db?options=-c%20timezone=UTC}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/medical-realm}

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:medical-realm}
    client-id: ${KEYCLOAK_CLIENT_ID:medical-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:medical-backend-dev-secret}

services:
  appointment:
    transport: ${APPOINTMENT_TRANSPORT:http}
    http:
      url: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}
      connect-timeout: ${APPOINTMENT_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${APPOINTMENT_HTTP_READ_TIMEOUT:3s}
    grpc:
      host: ${APPOINTMENT_GRPC_HOST:localhost}
      port: ${APPOINTMENT_GRPC_PORT:9093}
      deadline: ${APPOINTMENT_GRPC_DEADLINE:2s}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

resilience4j:
  retry:
    instances:
      appointmentServiceRetry:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.bank.userservice.exception.RemoteServiceUnavailableException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - com.bank.userservice.exception.RemoteResourceNotFoundException

  circuitbreaker:
    instances:
      appointmentServiceCb:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 6
        minimumNumberOfCalls: 4
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.bank.userservice.exception.RemoteServiceUnavailableException
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - com.bank.userservice.exception.RemoteResourceNotFoundException

app:
  scheduling:
    idempotency-cleanup-rate-ms: 30000
    idempotency-ttl-hours: 24