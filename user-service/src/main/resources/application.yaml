server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/users_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/medical-realm}

keycloak:
  admin:
    server-url: http://localhost:8081
    realm: medical-realm
    client-id: medical-backend
    client-secret: medical-backend-dev-secret

services:
  appointment:
    url: ${APPOINTMENT_SERVICE_URL:http://localhost:8083}